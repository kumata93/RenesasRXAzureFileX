name: CI Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-unit-tests:
    name: Host Unity Unit Tests (LevelX + FileX Sim)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make gcc-multilib

      - name: Run Unity unit tests
        working-directory: tests
        run: |
          make clean
          make test
